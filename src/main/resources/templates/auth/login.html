<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>
<body>
<h1>Вход</h1>

<div th:if="${param.error}" style="color:red">Неверный логин или пароль</div>
<div th:if="${param.logout}" style="color:green">Вы вышли из системы</div>
<div th:if="${param.registered}" style="color:green">Регистрация прошла успешно. Войдите.</div>

<form th:action="@{/login}" method="post">
    <input type="text" name="username" placeholder="Логин" required autofocus>
    <input type="password" name="password" placeholder="Пароль" required>
    <button type="submit">Войти</button>
</form>
<a th:href="@{/register}">Регистрация</a>
</body>
</html>
