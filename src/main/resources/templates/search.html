<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head><meta charset="UTF-8"><title>Профиль пользователя</title></head>
<body>
<h1 th:text="'Профиль: ' + ${foundUser.username}"></h1>
<p th:text="'Рейтинг: ' + ${foundUser.socialRating}"></p>

<div th:switch="${status}">
    <div th:case="'NOT_EXISTS'">
        <form th:action="@{/friendship/send}" method="post">
            <input type="hidden" name="target" th:value="${foundUser.username}"/>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">Добавить в друзья</button>
        </form>
    </div>
    <div th:case="'PENDING'">
        <p>Запрос в друзья в обработке</p>
        <form th:action="@{/friendship/cancel}" method="post" th:if="${requestId != -1}">
            <input type="hidden" name="requestId" th:value="${requestId}"/>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">Отменить запрос</button>
        </form>
    </div>
    <div th:case="'ACCEPTED'">
        <p>У вас в друзьях</p>
        <form th:action="@{/friendship/remove}" method="post">
            <input type="hidden" name="target" th:value="${foundUser.username}"/>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">Удалить из друзей</button>
        </form>
    </div>
</div>

<h2>Посты:</h2>
<div th:each="post : ${posts}">
    <p th:text="${post.content}"></p>
    <span th:text="'Лайков: ' + ${post.likeCount}"></span>

    <div th:if="${likedMap[post.postId]}">
        <form th:action="@{'/likes/' + ${post.postId} + '/unlike'}" method="post">
            <input type="hidden" name="redirect" th:value="'/search?query=' + ${foundUser.username}"/>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">❤️ Убрать лайк</button>
        </form>
    </div>
    <div th:unless="${likedMap[post.postId]}">
        <form th:action="@{'/likes/' + ${post.postId} + '/like'}" method="post">
            <input type="hidden" name="redirect" th:value="'/search?query=' + ${foundUser.username}"/>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">🤍 Поставить лайк</button>
        </form>
    </div>
</div>
</body>
</html>
