<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head><meta charset="UTF-8"><title>Главная</title></head>
<body>
<h1>Главная страница</h1>
<a th:href="@{/profile}">Мой профиль</a> |
<a th:href="@{/friendsList}">Друзья</a> |
<a th:href="@{/notifications}">Уведомления</a> |
<form th:action="@{/logout}" method="post" style="display:inline;">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <button type="submit">Выйти</button>
</form>
<form th:action="@{/search}" method="get">
  <input type="text" name="query" placeholder="Поиск пользователей..." required>
  <button type="submit">Найти</button>
</form>
</body>
</html>
