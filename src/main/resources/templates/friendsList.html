<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head><meta charset="UTF-8"><title>Друзья</title></head>
<body>
<h1>Список друзей</h1>
<div th:if="${friends.isEmpty()}"><p>У вас пока нет друзей.</p></div>
<div th:each="friend : ${friends}">
  <h2 th:text="${friend}"></h2>
</div>
</body>
</html>
