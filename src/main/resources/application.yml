spring:
  application:
    name: SocialNetwork

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/social_network?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true

  thymeleaf:
    cache: false

server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true
        secure: false
      timeout: 30m